<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="pv-spec" content="PV-SPEC-2026-10-v18 18.0">
  <title>写真</title>
  <link rel="preload" href="fonts/dotgothic16-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#grid-panel">写真一覧へ移動</a>

  <main class="app-main" id="main">
    <!-- サイト名（photos.json の title）。v11 から画面には出さず、読み上げとブラウザーのタブの名前にだけ使う。
         v13 で年のタブ（上部のバー）を廃止し、全部の写真を新しい順に1つの一覧にした -->
    <h1 class="app-title visually-hidden" id="app-title"></h1>
    <figure class="cover" id="cover" hidden>
      <button type="button" class="cover-btn" id="cover-btn" aria-label="表紙の写真を全画面で見る">
        <img class="cover-img" id="cover-img" alt="" decoding="async">
      </button>
    </figure>
    <p class="site-meta">
      <!-- 撮影年の範囲。app-count は表示できないデータがあるときだけ使う（v13 で「〜年の〜枚」は廃止） -->
      <span class="app-count" id="photo-count"></span>
      <span class="site-range" id="photo-range"></span>
      <!-- 見せ方（パターン）を選び直す（v12。v13 から英語。動く見せ方のときだけ出す。
           パターン1では同じ文字を写真と一緒に散らし、このボタンはキーボードで移ったときだけ見せる） -->
      <button type="button" class="pattern-switch" id="pattern-switch" lang="en" hidden>Change view</button>
    </p>
    <div class="status" id="status" role="status" aria-live="polite" data-state="loading">
      <span class="spinner" aria-hidden="true"></span>
      <p class="status-text" id="status-text">読み込み中…</p>
      <button type="button" class="status-retry" id="status-retry" hidden>再読み込み</button>
    </div>
    <section class="grid-panel" id="grid-panel" aria-label="写真一覧" tabindex="-1">
      <!-- 動かない一覧（視差効果を減らす設定のとき）: 正方形を縦に並べる -->
      <ul class="grid" id="grid" aria-busy="true"></ul>
      <div class="grid-sentinel" id="grid-sentinel" aria-hidden="true"></div>
      <!-- 動く一覧（v10）: 写真を終わりのない平面に散らす。位置は app.js が transform で決める（散らし方は読み込むたびに変わる）。
           写真が少ないときに画面を埋める複製は drift-copies に、散らした「Change view」（v13）は drift-labels に入れ、読み上げない。
           v17: 3つのパターンとも、部品は画面の近くの写真の分だけ app.js が作り、離れたら片付ける（写真が増えても軽いまま） -->
      <div class="drift" id="drift">
        <ul class="drift-list" id="drift-list"></ul>
        <div class="drift-copies" id="drift-copies" aria-hidden="true"></div>
        <div class="drift-labels" id="drift-labels" aria-hidden="true"></div>
      </div>
      <!-- パターン2「並べる」（v12）: 写真を列に並べ、スクロールすると列ごとに遅れてついてくる。
           v17 から写真は1つのリスト（新しい順）に入れ、列と段の位置は app.js が置く -->
      <div class="elastic" id="elastic"></div>
      <!-- パターン3「揺れる」（v14〜v16）: 撮影日ごとに1本の斜めの紐を張り、写真と日付の札を吊るして（番号の札は v16 で廃止）、
           スクロール・スライドの勢いとそよ風で揺らす。画面に収まらない日の紐は左右にスライドできる（sway-bands が受け持つ）。
           紐と札は飾り（札の日付は写真の代替テキストと同じ内容）なので読み上げない -->
      <div class="sway" id="sway">
        <div class="sway-lines" id="sway-lines" aria-hidden="true"></div>
        <div class="sway-bands" id="sway-bands" aria-hidden="true"></div>
        <ul class="sway-list" id="sway-list"></ul>
        <div class="sway-tags" id="sway-tags" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <!-- 最初に見せ方（パターン）を選ぶ画面（v12）。視差効果を減らす設定のときは出さない -->
  <dialog class="chooser" id="chooser" aria-labelledby="chooser-title">
    <div class="chooser-inner">
      <p class="chooser-title" id="chooser-title" lang="en">Choose a view</p>
      <ul class="chooser-list">
        <li>
          <button type="button" class="chooser-opt" data-pattern="1" aria-describedby="chooser-note-1">
            <span class="chooser-no" aria-hidden="true">1</span>
            <svg class="chooser-fig" viewBox="0 0 72 48" width="72" height="48" aria-hidden="true" focusable="false">
              <rect x="3" y="4" width="16" height="11"/><rect x="40" y="2" width="11" height="15"/><rect x="25" y="20" width="18" height="12"/>
              <rect x="56" y="16" width="13" height="10"/><rect x="6" y="30" width="12" height="15"/><rect x="50" y="33" width="17" height="11"/>
            </svg>
            <span class="chooser-name">散らばる</span>
            <span class="chooser-note" id="chooser-note-1">写真が大小ばらばらに散らばり、スクロールで漂う</span>
          </button>
        </li>
        <li>
          <button type="button" class="chooser-opt" data-pattern="2" aria-describedby="chooser-note-2">
            <span class="chooser-no" aria-hidden="true">2</span>
            <svg class="chooser-fig" viewBox="0 0 72 48" width="72" height="48" aria-hidden="true" focusable="false">
              <rect x="4" y="8" width="16" height="18"/><rect x="4" y="30" width="16" height="18"/>
              <rect x="28" y="2" width="16" height="18"/><rect x="28" y="24" width="16" height="18"/>
              <rect x="52" y="8" width="16" height="18"/><rect x="52" y="30" width="16" height="18"/>
            </svg>
            <span class="chooser-name">並べる</span>
            <span class="chooser-note" id="chooser-note-2">写真が列に並び、列ごとに遅れてついてくる</span>
          </button>
        </li>
        <li>
          <button type="button" class="chooser-opt" data-pattern="3" aria-describedby="chooser-note-3">
            <span class="chooser-no" aria-hidden="true">3</span>
            <svg class="chooser-fig" viewBox="0 0 72 48" width="72" height="48" aria-hidden="true" focusable="false">
              <path d="M1 6L71 12M1 30L71 24"/>
              <rect x="9" y="8" width="12" height="15"/><rect x="31" y="9" width="17" height="11"/><rect x="56" y="11" width="10" height="13"/>
              <rect x="12" y="29" width="16" height="11"/><rect x="40" y="27" width="11" height="16"/>
            </svg>
            <span class="chooser-name">揺れる</span>
            <span class="chooser-note" id="chooser-note-3">写真が斜めの紐に吊るされ、スクロールや風で揺れる</span>
          </button>
        </li>
      </ul>
    </div>
  </dialog>

  <dialog class="viewer" id="viewer" aria-label="写真の全画面表示" aria-describedby="viewer-caption">
    <div class="viewer-bar">
      <p class="viewer-no" id="viewer-no" aria-hidden="true"></p>
      <p class="viewer-counter" id="viewer-counter" aria-live="polite"></p>
      <button type="button" class="viewer-btn viewer-close" id="viewer-close" aria-label="閉じる">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="viewer-stage" id="viewer-stage">
      <img class="viewer-img" id="viewer-img" alt="" draggable="false" decoding="async">
      <span class="spinner viewer-spinner" id="viewer-spinner" aria-hidden="true" hidden></span>
      <p class="viewer-error" id="viewer-error" role="alert" hidden>画像を読み込めませんでした</p>
    </div>
    <div class="viewer-foot">
      <button type="button" class="viewer-btn viewer-nav viewer-prev" id="viewer-prev" aria-label="前の写真">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="viewer-caption" id="viewer-caption"></p>
      <button type="button" class="viewer-btn viewer-nav viewer-next" id="viewer-next" aria-label="次の写真">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </dialog>


  <noscript><p class="noscript">写真を表示するには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
